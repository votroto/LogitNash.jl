name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - uses: julia-actions/julia-buildpkg@v1

      # Run tests with native LCOV generation
      - name: Run Tests and Generate Coverage
        run: |
          julia --project=. -e 'using Pkg; Pkg.test(julia_args=["--code-coverage=coverage.info","--code-coverage=@src"])'

      # Parse the LCOV file and update the Gist
      - name: Update Coverage Gist
        # Prevent PRs from polluting your main branch badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "7cc2561e5897bc8c43270ce659b45199"
        run: |
          # 1. Parse coverage.info instantly using awk
          COVERAGE=$(awk '/^LF:/ { total += substr($0,4) } /^LH:/ { hit += substr($0,4) } END { if (total > 0) printf "%.2f", (hit / total) * 100; else print "0.00" }' coverage.info)

          # 2. Assign badge color dynamically
          COLOR=$(awk -v cov="$COVERAGE" 'BEGIN { if(cov >= 90) print "brightgreen"; else if (cov >= 75) print "yellow"; else print "red" }')

          # 3. Build Shields.io JSON
          cat << EOF > LogitNashCoverage.json
          {
            "schemaVersion": 1,
            "label": "Coverage",
            "message": "${COVERAGE} %",
            "color": "${COLOR}"
          }
          EOF

          # 4. Push directly to Gist via GitHub CLI
          gh gist edit "$GIST_ID" --filename LogitNashCoverage.json LogitNashCoverage.json